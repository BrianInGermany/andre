<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="120"> 
    <title>Abfahrten HSS18 (Kiosk)</title>
</head>
<body>
    <div id="rmv-kiosk" 
         data-hfs-widget="true" 
         data-hfs-widget-cfg-colorscheme="light" 
         data-hfs-widget-sq="true" 
         data-hfs-widget-sq-displaymode="results" 
         data-hfs-widget-sq-location="A=1@O=OF Marktplatz S-Bahn@X=8765669@Y=50105271@U=80@L=3011265@p=1770662770@" 
         data-hfs-widget-sq-locationname="OF Marktplatz S-Bahn">
    </div>

    <script>
        // 1. Zeit sofort berechnen und setzen, bevor das RMV-Skript lädt
        (function() {
            const nun = new Date();
            nun.setMinutes(nun.getMinutes() + 5);

            const stunden = String(nun.getHours()).padStart(2, '0');
            const minuten = String(nun.getMinutes()).padStart(2, '0');
            const startZeit = stunden + ":" + minuten;

            const widget = document.getElementById('rmv-kiosk');
            widget.setAttribute('data-hfs-widget-sq-time', startZeit);
            
            // Debug-Check für dich:
            console.log("Startzeit gesetzt auf: " + startZeit);
        })();

        // 2. Erst JETZT das RMV-Skript dynamisch laden
        const script = document.createElement('script');
        script.src = "https://www.rmv.de/auskunft/rmv/app/staticfiles/hafas-widget-core.1.0.0.js?language=de_DE";
        document.head.appendChild(script);
    </script>
</body>
</html>
