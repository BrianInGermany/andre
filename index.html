<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="120"> 
    <title>Abfahrten HSS18 (Kiosk)</title>
</head>
<body>
    <div id="rmv-container">
        </div>

    <script>
        (function() {
            // 1. Zeit berechnen (+5 Minuten)
            const nun = new Date();
            nun.setMinutes(nun.getMinutes() + 5);
            const stunden = String(nun.getHours()).padStart(2, '0');
            const minuten = String(nun.getMinutes()).padStart(2, '0');
            const zeitString = stunden + minuten; // Format HHMM für den Location-String

            // 2. Den Location-String anpassen (wir fügen @t=HHMM hinzu)
            const basisLocation = "A=1@O=OF Marktplatz S-Bahn@X=8765669@Y=50105271@U=80@L=3011265@p=1770662770@";
            const angepassteLocation = basisLocation + "t=" + zeitString + "@";

            // 3. Das HTML Element erst jetzt mit den fertigen Werten erstellen
            const container = document.getElementById('rmv-container');
            container.innerHTML = `
                <div data-hfs-widget="true" 
                     data-hfs-widget-cfg-colorscheme="light" 
                     data-hfs-widget-sq="true" 
                     data-hfs-widget-sq-displaymode="results" 
                     data-hfs-widget-sq-location="${angepassteLocation}" 
                     data-hfs-widget-sq-locationname="OF Marktplatz S-Bahn">
                </div>
            `;

            // 4. Erst jetzt das RMV-Skript laden
            const script = document.createElement('script');
            script.src = "https://www.rmv.de/auskunft/rmv/app/staticfiles/hafas-widget-core.1.0.0.js?language=de_DE";
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
