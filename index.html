<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LightWidget Hochkant</title>

  <!-- LightWidget Script -->
  <script src="https://cdn.lightwidget.com/widgets/lightwidget.js"></script>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000; /* optional: schwarz für Insta-Look */
    }

    /* Container für Hochkant */
    .widget-wrapper {
      width: 100%;
      height: 100vh; /* volle Höhe im Hochkant */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Iframe Styling */
    .lightwidget-widget {
      width: 100%;
      height: 100%;
      max-width: 480px; /* ideal für Hochkant / Handy */
      border: 0;
      overflow: hidden;
    }

    /* Optional: Tablet */
    @media (min-width: 768px) {
      .lightwidget-widget {
        max-width: 420px;
      }
    }
  </style>
</head>

<body>
  <div class="widget-wrapper">
    <iframe
      src="https://cdn.lightwidget.com/widgets/2d58717c526e519a94c4cd15a79c7134.html"
      scrolling="no"
      allowtransparency="true"
